name: ${COMPOSE_PROJECT_NAME}

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: sleep infinity
    init: true
    volumes:
      - type: bind
        source: ..
        target: /workspace
    environment:
      ASTRO_OLLAMA_HOST: http://host.docker.internal:11434
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - target: 8501
        published: "0"
        protocol: tcp
