[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-ai-agent"
version = "0.1.0"
description = "Vedic astrology AI agent powered by local LLMs (Ollama) and classical BPHS RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "requests",
    "pyswisseph",
    "chromadb",
    "rank-bm25",
    "pydantic>=2",
    "python-dateutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-requests",
    "PyMuPDF",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["astro_agent*"]

# ---------------------------------------------------------------------------
# Ruff — fast linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
    "UP007",  # use X | Y for union types — keep py3.9 compat syntax
]
per-file-ignores = { "tests/*" = ["F401"], "evals/*" = ["F401", "E402"] }

[tool.ruff.lint.isort]
known-first-party = ["astro_agent"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy — static type-checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = ["evals/", "tests/", "scripts/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
